<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Town | Vehicle Analyzer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vehicle-analyzer.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">PT</div>
        <div>
          <div class="eyebrow">PALETTE TOWN / GARAGE</div>
          <h1>Vehicle Analyzer</h1>
        </div>
      </div>

      <div class="header-actions">
        <a class="page-link" href="index.html">Mechanic Desk</a>
        <button id="themeBtn" class="theme-btn">🌙</button>
        <button id="analyzeBtn">解析する</button>
        <button id="clearBtn" class="ghost">クリア</button>
      </div>
    </header>

    <section class="panel analyzer-input">
      <div class="panel-head">
        <div>
          <span class="section-no">01</span>
          <h2>車両カスタム情報</h2>
        </div>
        <span class="hint">オーダーシートの文章をそのまま貼り付け</span>
      </div>

      <textarea id="orderInput" spellcheck="false"
        placeholder="スポイラー - [12. NULL ],リアバンパー - [1. NULL ],エアフィルター - [1. NULL ],..."></textarea>

      <div class="analyzer-tools">
        <span id="parseStatus">入力待ち</span>
        <button id="sampleBtn" class="ghost small">サンプルを入力</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <span class="section-no">02</span>
          <h2>必要アイテム合計</h2>
        </div>
        <div class="counts">
          <span id="itemCount">0個</span>
          <span id="typeCount">0種類</span>
        </div>
      </div>

      <div id="summaryGrid" class="analyzer-summary empty">
        <div class="empty-state">オーダーシートを解析すると、必要アイテムがここに表示されます。</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <span class="section-no">03</span>
          <h2>カスタム項目</h2>
        </div>
        <span class="hint">各項目が実際に必要なアイテムへ変換されます</span>
      </div>

      <div id="detailGrid" class="analyzer-details">
        <div class="empty-state">まだ解析されていません。</div>
      </div>
    </section>

    <footer>
      <span>PALETTE TOWN VEHICLE ANALYZER</span>
      <span>ORDER SHEET PARSER</span>
    </footer>

  </div>

  <script src="vehicle-analyzer.js"></script>
</body>
</html>
