<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Town | Color Book</title>
  <link rel="stylesheet" href="colors.css?v=20261008-2305">
</head>
<body>
  <div class="color-app">
    <header class="color-topbar">
      <div class="color-brand">
        <div class="color-brand-mark">PT</div>
        <div>
          <div class="eyebrow">PALETTE TOWN / GARAGE</div>
          <h1>Color Book</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost" type="button" onclick="location.href='index.html'">Mechanic Desk</button>
        <button id="paletteBtn" class="ghost" type="button">塗装一覧</button>
        <button id="themeBtn" class="ghost" type="button">🌙</button>
      </div>
    </header>

    <section class="catalog-toolbar">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="名称・色タグ・区分を検索">
      </div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="sync-status" id="syncStatus">読み込み中…</div>
    </section>

    <main class="catalog-layout">
      <section class="catalog-main">
        <div class="catalog-summary">
          <div>
            <div class="eyebrow">COLOR REGISTRY</div>
            <h2 id="viewTitle">登録カラー</h2>
          </div>
          <strong id="totalCount">0件</strong>
        </div>
        <div id="schemeSections"></div>
      </section>

      <aside class="editor-panel">
        <div class="eyebrow">ADD ENTRY</div>
        <h2>新規カラーを追加</h2>
        <form id="addForm">
          <label>区分
            <select id="groupInput" required>
              <option value="ギャング">ギャング</option>
              <option value="半グレ">半グレ</option>
              <option value="その他">その他</option>
            </select>
          </label>
          <label>名称
            <input id="nameInput" required placeholder="例: LAZOS">
          </label>
          <label>色タグ
            <input id="tagInput" placeholder="例: 黒色 / 水色 / ピンク">
          </label>

          <section class="slot-editor-wrap">
            <div class="slot-editor-heading">
              <strong>カラー指定</strong>
              <small>メイン・サブ・パール・ホイールを設定</small>
            </div>
            <div id="slotEditors"></div>
          </section>

          <label>追加詳細（任意）
            <textarea id="noteInput" rows="4" placeholder="補足事項があれば入力"></textarea>
          </label>
          <button class="primary" type="submit">新規追加</button>
          <button id="clearFormBtn" class="ghost" type="button">入力をクリア</button>
        </form>

        <div class="data-tools">
          <button id="exportBtn" class="ghost" type="button">JSONを書き出し</button>
          <label class="file-button">JSONを読み込み<input id="importInput" type="file" accept="application/json,.json"></label>
        </div>
        <p class="storage-note" id="storageNote"></p>
      </aside>
    </main>
  </div>

  <dialog id="paletteDialog" class="palette-dialog">
    <div class="palette-dialog-head">
      <div>
        <div class="eyebrow">PAINT REFERENCE</div>
        <h2>塗装一覧</h2>
      </div>
      <button id="closePaletteBtn" class="ghost" type="button">閉じる</button>
    </div>
    <div class="palette-filter-row">
      <select id="paletteCategory"></select>
      <input id="paletteSearch" type="search" placeholder="塗装名・番号を検索">
    </div>
    <div id="paletteGrid" class="palette-grid"></div>
  </dialog>

  <script src="colors-data.js?v=20261008-2305"></script>
  <script src="shared-config.js?v=20261008-2305"></script>
  <script src="colors.js?v=20261008-2305"></script>
</body>
</html>
